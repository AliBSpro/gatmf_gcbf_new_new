# Hybrid MAPPO-GCBF+ Configuration for MPE Environments

# Environment Settings
simple_spread:
  scenario: "simple_spread"
  num_agents: 3
  num_landmarks: 3  
  max_episode_length: 25
  
  # Safety constraints
  min_distance: 0.18
  safety_margin: 0.04
  boundary_buffer: 0.08
  
  # GCBF+ parameters
  batch_size: 256
  buffer_size: 512
  lr_actor: 1.0e-5
  lr_cbf: 1.0e-5
  gnn_layers: 1
  horizon: 32
  
  # Hybrid training parameters
  u_ref_weight: 0.7
  safety_weight: 0.3
  mappo_update_freq: 1
  gcbf_update_freq: 1
  
  # Training schedule
  total_steps: 2000
  mappo_pretrain_steps: 500
  n_env_train: 16
  n_env_test: 8

simple_navigation:
  scenario: "simple_navigation"
  num_agents: 3
  num_landmarks: 3
  max_episode_length: 25
  
  # Safety constraints (slightly tighter for navigation)
  min_distance: 0.16
  safety_margin: 0.04
  boundary_buffer: 0.06
  
  # GCBF+ parameters
  batch_size: 256
  buffer_size: 512
  lr_actor: 1.0e-5
  lr_cbf: 1.0e-5
  gnn_layers: 1
  horizon: 32
  
  # Hybrid training parameters
  u_ref_weight: 0.8  # Higher task focus for navigation
  safety_weight: 0.2
  mappo_update_freq: 1
  gcbf_update_freq: 1
  
  # Training schedule
  total_steps: 2500
  mappo_pretrain_steps: 600
  n_env_train: 16
  n_env_test: 8

# Default training parameters
default:
  # Logging and evaluation
  log_interval: 10
  eval_interval: 50
  save_interval: 100
  
  # Device settings
  device: "auto"  # auto, cpu, or cuda
  seed: 42
  
  # MAPPO specific parameters
  mappo:
    hidden_size: 64
    learning_rate: 3.0e-4
    ppo_epochs: 10
    clip_param: 0.2
    entropy_coef: 0.01
    value_loss_coef: 1.0
    max_grad_norm: 10.0
    
  # GCBF+ specific parameters  
  gcbf:
    alpha: 1.2
    eps: 0.015
    inner_epoch: 8
    max_grad_norm: 2.0
    loss_action_coef: 0.001
    loss_unsafe_coef: 1.0
    loss_safe_coef: 1.0
    loss_h_dot_coef: 0.2
